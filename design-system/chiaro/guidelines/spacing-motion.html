<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);color:var(--text-primary);background:#fff}.row{display:flex;gap:10px}.sw{flex:1;border-radius:var(--radius-md);height:84px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font:600 11px/1.3 var(--font-body)}.lab{font:500 11px/1.4 var(--font-body);color:var(--text-secondary);margin-top:6px}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1;background:var(--neutral-50);border-radius:12px;padding:12px"><div style="font:700 13px var(--font-display)">--ease-cine</div><div class="mono">cubic-bezier(.22,.61,.36,1)</div></div><div style="flex:1;background:var(--neutral-50);border-radius:12px;padding:12px"><div style="font:700 13px var(--font-display)">--ease-out</div><div class="mono">cubic-bezier(.16,1,.3,1)</div></div><div style="flex:1;background:var(--neutral-50);border-radius:12px;padding:12px"><div style="font:700 13px var(--font-display)">--dur-fast / base / slow</div><div class="mono">140 / 240 / 480ms</div></div><div style="flex:1;background:var(--neutral-50);border-radius:12px;padding:12px"><div style="font:700 13px var(--font-display)">--dur-scene</div><div class="mono">900ms — revelações</div></div></div></body></html>
